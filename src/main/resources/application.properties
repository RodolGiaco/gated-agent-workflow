spring.application.name=oms

# The credentials come from the environment; no password is kept in source.
spring.datasource.url=${OMS_DATABASE_URL:jdbc:postgresql://localhost:5432/oms}
spring.datasource.username=${OMS_DATABASE_USERNAME:oms}
spring.datasource.password=${OMS_DATABASE_PASSWORD:1234}

# Flyway owns the schema. Hibernate only checks that the entities match it and
# never creates, updates or drops a table.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
